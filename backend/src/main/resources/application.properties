# ==========================================
# CartMind AI - Application Configuration
# ==========================================

spring.application.name=cartmind-backend

# ==========================================
# Server
# ==========================================

server.port=${SERVER_PORT:8080}

# ==========================================
# MySQL
# ==========================================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cartmind?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Rcm@2005}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# ==========================================
# AWS Bedrock
# ==========================================

aws.region=${AWS_REGION:us-east-1}

bedrock.model-id=${BEDROCK_MODEL_ID:global.anthropic.claude-haiku-4-5-20251001-v1:0}

# ==========================================
# CartMind
# ==========================================

cartmind.ai.enabled=${CARTMIND_AI_ENABLED:true}
cartmind.providers.local.enabled=${CARTMIND_LOCAL_PROVIDER_ENABLED:true}