# ==========================================
# CartMind AI - Application Configuration
# ==========================================

spring.application.name=cartmind-backend

# ==========================================
# Server
# ==========================================

server.port=8080

# ==========================================
# MySQL
# ==========================================

spring.datasource.url=jdbc:mysql://localhost:3306/cartmind?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Rcm@2005
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# JPA / Hibernate
# ==========================================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# Actuator
# ==========================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================================
# AWS Bedrock
# ==========================================

aws.region=${AWS_REGION:us-east-1}

# ==========================================
# CartMind
# ==========================================

cartmind.ai.enabled=true
cartmind.providers.local.enabled=true