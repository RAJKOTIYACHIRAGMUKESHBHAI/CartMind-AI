<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | CartMind AI</title>
  <link rel="stylesheet" href="css/main.css">
</head>

<body class="login-page">

<header class="navbar">
  <div class="container nav">

    <a class="brand" href="index.html">
      <img
        class="brand-logo"
        src="assets/logo/cartmind-main-logo(1).png"
        alt="CartMind AI logo"
      >

      <span>
        <b>CartMind AI</b>
        <small>AI shopping intelligence</small>
      </span>
    </a>

    <nav class="navlinks">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="compare.html">Compare</a>
      <a href="assistant.html">AI Assistant</a>
    </nav>

    <div class="navbtns">
      <a class="btn" href="login.html">Login</a>
      <a class="btn primary" href="register.html">Register</a>
      <button class="menu">☰</button>
    </div>

  </div>
</header>


<div class="auth-orb one"></div>
<div class="auth-orb two"></div>


<main class="authwrap">

  <section class="auth">

    <div class="auth-mark">
      <img
        src="assets/logo/cartmind-main-logo(1).png"
        alt="CartMind AI logo"
      >
    </div>

    <span class="eyebrow">
      Welcome Back
    </span>

    <h1>
      <em>Search. Sense. Select.</em>
    </h1>

    <p>
      Sign in to continue your CartMind AI
      shopping intelligence experience.
    </p>


    <form id="loginForm">

      <label>
        Email

        <input
          id="loginEmail"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >
      </label>


      <label>
        Password

        <input
          id="loginPassword"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </label>


      <button
        class="btn primary"
        type="submit"
        style="width:100%"
      >
        Login →
      </button>


      <div id="loginMessage"></div>

    </form>


    <p style="margin-top:22px">
      New to CartMind?
      <a
        href="register.html"
        style="color:var(--purple2)"
      >
        Create an account
      </a>
    </p>

  </section>

</main>


<footer class="footer">

  <div class="container">

    <b>CartMind AI</b>

    <span>
      Shop smarter. Decide better.
    </span>

  </div>

</footer>


<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/validation.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>

</body>
</html>
