<!-- =========================================
     CartMind AI - Clarification Box
     ========================================= -->

<section
  class="clarification-box"
  id="clarificationBox"
  aria-label="Clarification"
  hidden
>
  <div class="clarification-icon">
    ?
  </div>

  <div class="clarification-content">
    <span class="eyebrow">Need More Information</span>

    <h3>Let's refine your search.</h3>

    <p id="clarificationMessage">
      Please provide a little more information so CartMind AI can
      understand your request.
    </p>

    <div class="clarification-actions">
      <button
        type="button"
        class="btn primary"
        id="clarificationContinue"
      >
        Continue
      </button>

      <button
        type="button"
        class="btn"
        id="clarificationDismiss"
      >
        Dismiss
      </button>
    </div>
  </div>
</section>
