<!-- =========================================
     CartMind AI - AI Understanding Component
     ========================================= -->

<section class="ai-understanding" aria-label="AI Understanding">

  <div class="ai-understanding-header">
    <div>
      <span class="eyebrow">CartMind Intelligence</span>
      <h2>AI Understanding</h2>
      <p>
        Your shopping request, interpreted into clear decision signals.
      </p>
    </div>

    <div class="ai-status">
      <span class="status-dot"></span>
      Ready
    </div>
  </div>

  <div class="ai-understanding-grid">

    <article class="ai-understanding-card">
      <span class="ai-card-icon">✦</span>
      <small>Intent</small>
      <h3 data-field="intent"></h3>
      <p data-field="intentDescription"></p>
    </article>

    <article class="ai-understanding-card">
      <span class="ai-card-icon">⌁</span>
      <small>Requirements</small>
      <h3 data-field="requirements"></h3>
      <p data-field="requirementsDescription"></p>
    </article>

    <article class="ai-understanding-card">
      <span class="ai-card-icon">◇</span>
      <small>Priority</small>
      <h3 data-field="priority"></h3>
      <p data-field="priorityDescription"></p>
    </article>

  </div>

</section>
