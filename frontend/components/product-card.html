<!-- =========================================
     CartMind AI - Reusable Product Card
     ========================================= -->

<article class="product-card">

  <div class="product-image">
    <div class="product-image-placeholder">
      <span>PRODUCT</span>
    </div>
  </div>

  <div class="product-card-content">

    <div class="product-card-top">
      <span class="product-category" data-field="category"></span>
      <span class="product-match" data-field="match"></span>
    </div>

    <h3 data-field="name"></h3>

    <p
      class="product-description"
      data-field="description"
    ></p>

    <div class="product-meta">
      <span data-field="price"></span>
      <span data-field="rating"></span>
    </div>

    <div class="product-actions">
      <button
        type="button"
        class="btn"
        data-action="details"
      >
        View Details
      </button>

      <button
        type="button"
        class="btn primary"
        data-action="compare"
      >
        Compare
      </button>
    </div>

  </div>

</article>
