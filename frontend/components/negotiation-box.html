<!-- =========================================
     CartMind AI - Negotiation Box
     ========================================= -->

<section
  class="negotiation-box"
  id="negotiationBox"
  aria-label="Negotiation request"
>

  <div class="negotiation-header">
    <div>
      <span class="eyebrow">AI Assistance</span>

      <h2>Negotiation Request</h2>

      <p>
        Tell CartMind AI what you want to negotiate or clarify.
      </p>
    </div>

    <div class="negotiation-icon">
      ✦
    </div>
  </div>

  <form id="negotiationForm" class="negotiation-form">

    <label for="negotiationInput">
      Your request
    </label>

    <textarea
      id="negotiationInput"
      name="message"
      rows="4"
      placeholder="Enter your request..."
      maxlength="1000"
      required
    ></textarea>

    <div class="negotiation-footer">

      <small>
        Keep your request clear and specific.
      </small>

      <button
        type="submit"
        class="btn primary"
      >
        Send Request →
      </button>

    </div>

  </form>

</section>
