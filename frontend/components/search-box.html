<!-- =========================================
     CartMind AI - Reusable Search Box
     ========================================= -->

<form class="search-box" id="productsSearchForm">

  <div class="search-icon" aria-hidden="true">
    ✦
  </div>

  <div class="search-field">
    <label for="productsSearchInput">AI Search</label>

    <input
      type="text"
      id="productsSearchInput"
      name="query"
      placeholder="Describe what you're looking for..."
      autocomplete="off"
      required
    >
  </div>

  <button
    class="btn primary search-submit"
    type="submit"
  >
    <span>Search with AI</span>
    <span aria-hidden="true">→</span>
  </button>

</form>
