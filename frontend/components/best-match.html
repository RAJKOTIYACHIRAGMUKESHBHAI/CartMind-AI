<!-- =========================================
     CartMind AI - Best Match Component
     ========================================= -->

<section class="best-match" aria-label="Best Match">

  <div class="best-match-header">
    <div>
      <span class="eyebrow">AI Recommendation</span>
      <h2>Best Match</h2>
    </div>

    <div class="best-match-badge">
      <span>✦</span>
      AI MATCH
    </div>
  </div>

  <div class="best-match-card">

    <div class="best-match-visual">
      <div class="best-match-orb">
        <span>CM</span>
      </div>
    </div>

    <div class="best-match-content">

      <span class="best-match-label">
        Recommended for your request
      </span>

      <h3 data-field="name"></h3>

      <p data-field="reason"></p>

      <div class="best-match-facts">
        <div>
          <small>Match</small>
          <strong data-field="match"></strong>
        </div>

        <div>
          <small>Category</small>
          <strong data-field="category"></strong>
        </div>

        <div>
          <small>Price</small>
          <strong data-field="price"></strong>
        </div>
      </div>

      <div class="best-match-actions">
        <button
          type="button"
          class="btn primary"
          data-action="view-details"
        >
          View Details →
        </button>

        <button
          type="button"
          class="btn"
          data-action="compare"
        >
          Compare
        </button>
      </div>

    </div>

  </div>

</section>
