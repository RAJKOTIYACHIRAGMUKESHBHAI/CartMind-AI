<!-- =========================================
     CartMind AI - Empty State
     ========================================= -->

<section class="empty-state" id="emptyState">

  <div class="empty-state-visual">
    <div class="empty-orb">
      <span>CM</span>
    </div>
  </div>

  <div class="empty-state-content">

    <span class="eyebrow">CartMind AI</span>

    <h2 id="emptyStateTitle">
      Ready when you are.
    </h2>

    <p id="emptyStateMessage">
      Describe what you're looking for and CartMind AI
      will use the available search results to help you decide.
    </p>

    <button
      type="button"
      class="btn primary"
      id="emptyStateAction"
    >
      Start AI Search →
    </button>

  </div>

</section>
