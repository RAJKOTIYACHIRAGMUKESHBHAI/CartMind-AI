<!-- =========================================
     CartMind AI - Loading State
     ========================================= -->

<section
  class="loading-state"
  id="loadingState"
  aria-live="polite"
  aria-busy="true"
>

  <div class="loading-visual">
    <div class="loading-orb">
      <span>CM</span>
    </div>

    <div class="loading-ring"></div>
    <div class="loading-ring ring-two"></div>
  </div>

  <div class="loading-content">
    <span class="eyebrow">CartMind Intelligence</span>

    <h2 id="loadingTitle">
      Understanding your request...
    </h2>

    <p id="loadingMessage">
      Please wait while the AI search request is being processed.
    </p>

    <div class="loading-dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>

</section>
